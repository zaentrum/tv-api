apiVersion: apps/v1
kind: Deployment
metadata:
  name: tv-api
  labels:
    app: tv-api
    product: tv
    role: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tv-api
  template:
    metadata:
      labels:
        app: tv-api
        product: tv
        role: backend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Replace with your own registry/image reference.
          image: ghcr.io/zaentrum/tv-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ADDR
              value: ":8080"
            # Point at your own OIDC issuer / audience.
            - name: OIDC_ISSUER
              value: ""
            - name: OIDC_AUDIENCE
              value: "tv"
            - name: OIDC_ENABLED
              value: "true"
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
